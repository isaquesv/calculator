<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculadora</title>
        <link rel="icon" href="assets/img/favicon_isv.png" type="image/png">
        <meta name="author" content="isaquesv">
        <meta name="description" content="Calculadora web simples e intuitiva feita com HTML, CSS e JavaScript.">
        <meta name="keywords" content="Calculadora,HTML,CSS,JavaScript,Web,Calculadora online,Fatorial,Porcentagem">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <!-- Importando fonte personalizada JetBrains -->
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&DISPLAY=swap" rel="stylesheet">
        <link rel="stylesheet" href="assets/css/style.css">
        <link rel="stylesheet" href="assets/css/nav.css">
        <link rel="stylesheet" href="assets/css/calculator.css">
        <link rel="stylesheet" href="assets/css/display.css">
        <link rel="stylesheet" href="assets/css/button.css">
        <link rel="stylesheet" href="assets/css/footer.css">
    </head>
    <body>

        <div class="container py-4 px-1">
            <nav>
                <h1>Calculadora</h1>
            </nav>

            <div class="my-4" id="calculator">
                <div>
                    <div id="calculator-controls">
                        <select class="form-select" id="select-theme" title="Tema">
                            <option value="light">Tema Claro</option>
                            <option value="dark">Tema Escuro</option>
                            <option value="old">Tema Antigo</option>
                        </select>
                    </div>

                    <table class="table m-0">
                        <thead>
                            <tr>
                                <th scope="col" colspan="4">
                                    <input id="display" class="form-control" readonly value="0" />
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row" title="Limpar tudo">
                                    <button class="btn-calculator util" value="clearAll">
                                        <div class="button_top">C</div>
                                    </button>
                                </th>
                                <td title="Apagar último dígito">
                                    <button class="btn-calculator util" value="backspace">
                                        <div class="button_top"><-</div>
                                    </button>
                                </td>
                                <td title="Porcentagem">
                                    <button class="btn-calculator operator" value="%">
                                        <div class="button_top">%</div>
                                    </button>
                                </td>
                                <td title="Fatorial (n!)">
                                    <button class="btn-calculator operator" value="!">
                                        <div class="button_top">n!</div>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td title="Número 7">
                                    <button class="btn-calculator numeric" value="7">
                                        <div class="button_top">7</div>
                                    </button>
                                </td>
                                <td title="Número 8">
                                    <button class="btn-calculator numeric" value="8">
                                        <div class="button_top">8</div>
                                    </button>
                                </td>
                                <td title="Número 9">
                                    <button class="btn-calculator numeric" value="9">
                                        <div class="button_top">9</div>
                                    </button>
                                </td>
                                <td title="Divisão">
                                    <button class="btn-calculator operator" value="/">
                                        <div class="button_top">/</div>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td title="Número 4">
                                    <button class="btn-calculator numeric" value="4">
                                        <div class="button_top">4</div>
                                    </button>
                                </td>
                                <td title="Número 5">
                                    <button class="btn-calculator numeric" value="5">
                                        <div class="button_top">5</div>
                                    </button>
                                </td>
                                <td title="Número 6">
                                    <button class="btn-calculator numeric" value="6">
                                        <div class="button_top">6</div>
                                    </button>
                                </td>
                                <td title="Multiplicação">
                                    <button class="btn-calculator operator" value="x">
                                        <div class="button_top">x</div>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td title="Número 1">
                                    <button class="btn-calculator numeric" value="1">
                                        <div class="button_top">1</div>
                                    </button>
                                </td>
                                <td title="Número 2">
                                    <button class="btn-calculator numeric" value="2">
                                        <div class="button_top">2</div>
                                    </button>
                                </td>
                                <td title="Número 3">
                                    <button class="btn-calculator numeric" value="3">
                                        <div class="button_top">3</div>
                                    </button>
                                </td>
                                <td title="Subtração">
                                    <button class="btn-calculator operator" value="-">
                                        <div class="button_top">-</div>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td title="Número 0">
                                    <button class="btn-calculator numeric" value="zero">
                                        <div class="button_top">0</div>
                                    </button>
                                </td>
                                <td title="Ponto decimal">
                                    <button class="btn-calculator util" value=".">
                                        <div class="button_top">.</div>
                                    </button>
                                </td>
                                <td title="Última resposta">
                                    <button class="btn-calculator util" value="answer">
                                        <div class="button_top">Ans</div>
                                    </button>
                                </td>
                                <td title="Adição">
                                    <button class="btn-calculator operator" value="+">
                                        <div class="button_top">+</div>
                                    </button>
                                </td>
                            </tr>
                            <tr>
                                <td title="Trocar sinal (+/-)">
                                    <button class="btn-calculator util" value="changeSign">
                                        <div class="button_top">+/-</div>
                                    </button>
                                </td>
                                <td title="Calcular resultado" colspan="3">
                                    <button class="btn-calculator calculate" value="calculate">
                                        <div class="button_top">=</div>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <footer id="footer">
                <a href="https://github.com/isaquesv" target="_blank" title="Link para o perfil GitHub">© 2025–2025
                    <b>isaquesv</b>. Todos os direitos reservados.</a>
                <a href="https://github.com/isaquesv/calculator" target="_blank" title="Link para o repositório GitHub"><i
                        class="bi bi-github"></i> Repositório GitHub</a>
                <a href="https://github.com/isaquesv/calculator/blob/main/README.md" target="_blank"
                    title="Link para o README do repositório GitHub"><i class="bi bi-info-circle"></i> Mais sobre este
                    projeto</a>
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <script src="assets/js/theme.js"></script>
        <script src="assets/js/calculator.js" type="module"></script>
        <script src="assets/js/displayHorizontalScroll.js"></script>
        <script src="assets/js/footer.js"></script>
    </body>
</html>
